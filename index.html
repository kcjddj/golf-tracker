<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스코어카드 — 골프 라운드 기록</title>
<style>
  :root {
    color-scheme: light;
    --paper:      #f3efe3;
    --paper-alt:  #e9e1cb;
    --card:       #faf7ee;
    --ink:        #1e2a20;
    --ink-2:      #55604f;
    --muted:      #8a8578;
    --line:       #d9d2bc;
    --turf:       #2f6b4f;
    --turf-deep:  #1f4d38;
    --turf-wash:  #e3ece4;
    --flag:       #b8452f;
    --flag-wash:  #f3e2dc;
    --good:       #0ca30c;
    --good-deep:  #008300;
    --warn:       #c98500;
    --serious:    #ec835a;
    --critical:   #d03b3b;
    --shadow:     0 1px 2px rgba(30,42,32,0.06), 0 4px 14px rgba(30,42,32,0.07);
    --header-h:   62px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --paper:      #141d17;
      --paper-alt:  #1b2620;
      --card:       #1a251e;
      --ink:        #ece7d8;
      --ink-2:      #aab0a1;
      --muted:      #7d8579;
      --line:       #2b362e;
      --turf:       #62a884;
      --turf-deep:  #8fcbab;
      --turf-wash:  #1e332a;
      --flag:       #e0805f;
      --flag-wash:  #33221d;
      --good:       #35c235;
      --good-deep:  #4bd24b;
      --warn:       #f0a93a;
      --serious:    #f0997a;
      --critical:   #e8685f;
      --shadow:     0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:      #141d17;
    --paper-alt:  #1b2620;
    --card:       #1a251e;
    --ink:        #ece7d8;
    --ink-2:      #aab0a1;
    --muted:      #7d8579;
    --line:       #2b362e;
    --turf:       #62a884;
    --turf-deep:  #8fcbab;
    --turf-wash:  #1e332a;
    --flag:       #e0805f;
    --flag-wash:  #33221d;
    --good:       #35c235;
    --good-deep:  #4bd24b;
    --warn:       #f0a93a;
    --serious:    #f0997a;
    --critical:   #e8685f;
    --shadow:     0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --paper: #f3efe3; --paper-alt: #e9e1cb; --card: #faf7ee;
    --ink: #1e2a20; --ink-2: #55604f; --muted: #8a8578; --line: #d9d2bc;
    --turf: #2f6b4f; --turf-deep: #1f4d38; --turf-wash: #e3ece4;
    --flag: #b8452f; --flag-wash: #f3e2dc;
    --good: #0ca30c; --good-deep: #008300; --warn: #c98500;
    --serious: #ec835a; --critical: #d03b3b;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding-bottom: 48px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  .num { font-family: ui-serif, Georgia, "Nanum Myeongjo", serif; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  input, select { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--turf); outline-offset: 2px; }

  /* ── Header ───────────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 5px 14px 4px;
  }
  .brand { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .brand-name { font-family: ui-serif, Georgia, serif; font-size: 18px; font-weight: 600; letter-spacing: 0.2px; text-align: center; }
  .brand-name .accent { color: var(--turf); }
  .hcp-chip {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    display: flex; align-items: baseline; gap: 5px;
    background: var(--flag-wash); border-radius: 999px;
    padding: 3px 10px 3px 8px;
  }
  .hcp-chip .lbl { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--flag); opacity: 0.85; }
  .hcp-chip .val { font-size: 16px; font-weight: 600; color: var(--flag); }

  nav.tabs {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 5px; margin-top: 4px;
    background: var(--paper-alt); border-radius: 11px; padding: 3px;
  }
  nav.tabs button {
    border: none; background: transparent; color: var(--ink-2);
    padding: 6px 4px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  nav.tabs button.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

  main { max-width: 560px; margin: 0 auto; padding: 8px 10px; }
  section.panel { display: none; }
  section.panel.active { display: block; animation: fade 0.18s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 14px; }
  .card-title { font-size: 14.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 12px; }

  /* ── Live hole entry ──────────────────────────────────── */
  .live-header {
    position: sticky; top: var(--header-h, 62px); z-index: 19;
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 10px; margin-bottom: 3px; box-shadow: var(--shadow);
  }
  .live-course-input {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 7px; padding: 6px 9px; font-size: 15px; flex: 1 1 auto; max-width: 52%; min-width: 0;
  }
  .live-score-wrap { text-align: center; white-space: nowrap; }
  .live-score-v { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 20px; font-weight: 700; line-height: 1.05; }
  .live-score-sub { font-size: 10.5px; color: var(--muted); margin-top: 0; }

  .hole-title-row { display: flex; align-items: center; justify-content: space-between; margin: 5px 0 4px; gap: 10px; }
  .hole-title { font-family: ui-serif, Georgia, serif; font-size: 19px; font-weight: 700; }
  .par-picker { display: flex; align-items: center; gap: 6px; }
  .par-picker .lbl { font-size: 13px; font-weight: 700; color: var(--ink-2); }

  .cat-group { margin-bottom: 5px; }
  .cat-group.disabled { opacity: 0.45; }
  .cat-sub-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .cat-sub-row + .cat-sub-row { border-top: 1px solid var(--line); }
  .cat-sub-label { flex: 0 0 66px; font-size: 15px; font-weight: 700; color: var(--ink-2); }

  .btn-row { display: flex; gap: 4px; flex: 1; }
  .btn-row.disabled { opacity: 0.35; pointer-events: none; }
  .btn-row.compact { flex: 0 0 auto; }
  .pill-btn {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-2);
    border-radius: 9px; padding: 11px 0; font-size: 16px; font-weight: 700; cursor: pointer;
    flex: 1 1 0; min-width: 0; text-align: center; transition: background .12s, color .12s, border-color .12s;
  }
  .btn-row.compact .pill-btn { flex: 0 0 44px; }
  .pill-btn.sel { color: #fff; border-color: transparent; }

  .bottom-bar { margin-top: 6px; }
  .bottom-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
  .bottom-score {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 22px; font-weight: 700; text-align: center; justify-self: center;
  }
  .bottom-row .save-btn { width: auto; padding: 11px 15px; white-space: nowrap; }
  .next-btn { border: none; background: var(--turf); color: #fff; padding: 11px 15px; border-radius: 11px; font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .next-btn:disabled { background: var(--muted); opacity: 0.5; cursor: not-allowed; }

  .finish-page { text-align: center; padding: 60px 20px; }
  .finish-title { font-size: 15px; color: var(--ink-2); font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
  .finish-score { font-family: ui-serif, Georgia, serif; font-size: 54px; font-weight: 700; margin: 10px 0 6px; }
  .finish-score .diff { font-size: 26px; color: var(--flag); margin-left: 6px; }
  .finish-msg { font-size: 19px; color: var(--ink-2); margin: 18px 0 26px; }

  .memo-box {
    width: 100%; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 8px; padding: 9px 11px; font-size: 14.5px; resize: vertical;
    margin-top: 10px; font-family: inherit;
  }

  .save-btn {
    width: 100%; border: none; background: var(--turf); color: #fff;
    padding: 17px; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .save-btn:disabled { background: var(--muted); cursor: not-allowed; opacity: 0.6; }
  .save-btn:active:not(:disabled) { background: var(--turf-deep); }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; }

  /* ── Analysis ─────────────────────────────────────────── */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; box-shadow: var(--shadow); }
  .stat-tile .lbl { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; margin-bottom: 6px; }
  .stat-tile .v { font-family: ui-serif, Georgia, serif; font-size: 33px; font-weight: 600; line-height: 1; }
  .stat-tile .v.accent { color: var(--flag); }
  .stat-tile .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .save-grid { display: flex; flex-direction: column; gap: 9px; }
  .save-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .save-row .lbl { font-size: 15px; color: var(--ink-2); font-weight: 600; }
  .save-row .v { font-family: ui-serif, Georgia, serif; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .empty { text-align: center; padding: 40px 16px; color: var(--ink-2); }
  .empty .big { font-size: 34px; margin-bottom: 10px; }

  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .chart-wrap { position: relative; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--ink); color: var(--paper);
    font-size: 12px; padding: 6px 9px; border-radius: 7px; transform: translate(-50%, -115%);
    white-space: nowrap; opacity: 0; transition: opacity 0.1s; box-shadow: var(--shadow);
  }
  .tooltip.show { opacity: 1; }
  .tooltip .t-date { color: var(--ink-2); font-size: 10.5px; }

  .dist-row { display: grid; grid-template-columns: 60px 1fr 92px; align-items: center; gap: 8px; padding: 5px 0; }
  .dist-row .lbl { font-size: 12.5px; font-weight: 700; }
  .dist-track { height: 16px; background: var(--paper-alt); border-radius: 4px; overflow: hidden; position: relative; }
  .dist-fill { height: 100%; border-radius: 4px; min-width: 2px; }
  .dist-row .cnt { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

  /* ── History ──────────────────────────────────────────── */
  .round-row {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow);
  }
  .round-row summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .round-row summary::-webkit-details-marker { display: none; }
  .round-row .r-left { display: flex; flex-direction: column; gap: 2px; }
  .round-row .r-date { font-size: 13px; color: var(--muted); }
  .round-row .r-course { font-size: 16px; font-weight: 700; }
  .round-row .r-right { display: flex; align-items: center; gap: 8px; }
  .score-chip { font-family: ui-serif, Georgia, serif; font-size: 18px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .score-chip.under { background: var(--turf-wash); color: var(--turf-deep); }
  .score-chip.even  { background: var(--paper-alt); color: var(--ink-2); }
  .score-chip.over  { background: var(--flag-wash); color: var(--flag); }
  .chevron { color: var(--muted); transition: transform 0.15s; }
  .round-row[open] .chevron { transform: rotate(180deg); }
  .r-detail { padding: 0 14px 14px; border-top: 1px solid var(--line); }
  .r-mini-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin: 10px 0 4px; }
  .r-hole { text-align: center; font-size: 10.5px; }
  .r-hole .hn { color: var(--muted); }
  .r-hole .hs { font-weight: 700; font-variant-numeric: tabular-nums; border-radius: 5px; padding: 2px 0; margin-top: 1px; }
  .r-extra { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--ink-2); margin: 10px 0; }
  .r-extra b { color: var(--ink); }
  .del-btn { border: 1px solid var(--flag); color: var(--flag); background: transparent; border-radius: 8px; padding: 9px 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .del-btn.confirming { background: var(--flag); color: #fff; }

  ::selection { background: var(--turf-wash); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-name">스코어<span class="accent">카드</span></div>
    <div class="hcp-chip"><span class="lbl">HCP</span><span class="val" id="hdrHcp">—</span></div>
  </div>
  <nav class="tabs">
    <button data-tab="add" class="active">기록 추가</button>
    <button data-tab="analysis">분석</button>
    <button data-tab="history">기록 보기</button>
  </nav>
</header>

<main>
  <!-- ── 기록 추가 ─────────────────────────────────────── -->
  <section class="panel active" id="panel-add"></section>

  <!-- ── 분석 ─────────────────────────────────────────── -->
  <section class="panel" id="panel-analysis"></section>

  <!-- ── 기록 보기 ─────────────────────────────────────── -->
  <section class="panel" id="panel-history"></section>
</main>

<script>
(() => {
  const STORE_KEY = "golf-tracker-rounds-v2";
  const LIVE_KEY = "golf-tracker-live-v2";
  const PAR_COLORS = { par: "var(--muted)" };
  const BUCKET_META = [
    { key: "eagle",  label: "이글",     color: "var(--good-deep)" },
    { key: "birdie", label: "버디",     color: "var(--good)" },
    { key: "par",    label: "파",       color: "var(--muted)" },
    { key: "bogey",  label: "보기",     color: "var(--warn)" },
    { key: "double", label: "더블보기", color: "var(--serious)" },
    { key: "triple", label: "트리플보기", color: "var(--critical)" },
    { key: "quad",   label: "쿼드러플+", color: "var(--critical)" },
  ];

  const sum  = a => a.reduce((x, y) => x + y, 0);
  const mean = a => a.length ? sum(a) / a.length : 0;
  const fmt1 = n => (Math.round(n * 10) / 10).toFixed(1);
  const fmtRate = (num, den) => den ? `${num}/${den} (${fmt1(num / den * 100)}%)` : `${num}/${den} (—)`;
  const fmtPer18 = (num, den) => den ? `${num}/${den} (${fmt1(num / den * 18)}/18)` : `${num}/${den} (—)`;

  // ── storage ──────────────────────────────────────────
  function loadRounds() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch { return []; }
  }
  function saveRounds(rounds) {
    localStorage.setItem(STORE_KEY, JSON.stringify(rounds));
  }
  let rounds = loadRounds();

  const fmtDiff = d => d === 0 ? "E" : (d > 0 ? `+${d}` : `${d}`);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ── live round entry (paginated hole-by-hole flow) ────
  // Row positions 0..3 are fixed (top→bottom); which ones are active depends on par.
  // Row 3 (bottom) is always active and has no FW option — it's the shot that decides GIR.
  const activeStartRow = par => 6 - par;                          // par3→3, par4→2, par5→1, par6→0
  const isRowActive    = (par, r) => r >= activeStartRow(par);
  const rowOptions     = r => r === 3 ? ["OB", "PA", "BK", "RF", "GR"] : ["OB", "PA", "BK", "RF", "FW", "GR"];
  const shotRowLabel   = (par, r) => {
    if (!isRowActive(par, r)) return ["1st shot", "2nd shot", "3rd shot", "4th shot"][r];
    const i = r - activeStartRow(par);
    return ["Tee shot", "2nd shot", "3rd shot", "4th shot"][i];
  };
  const shotPoint = v => v === "OB" ? 3 : (v === "PA" ? 2 : 1);
  const pillColor = v => v === "OB" ? "var(--critical)" : v === "PA" ? "var(--serious)"
    : (v === "BK" || v === "RF") ? "var(--warn)" : "var(--turf)";

  function freshHole() {
    return {
      par: 4,
      rowValues: ["FW", "FW", "FW", "GR"],
      approach: { pitching: null, bunker: null, chip: null },
      putt: 2,
      saved: false,
      result: null,
    };
  }
  function freshLiveState() {
    return { course: "", currentHole: 0, holes: Array.from({ length: 18 }, freshHole) };
  }
  function loadLive() {
    try {
      const raw = JSON.parse(localStorage.getItem(LIVE_KEY));
      if (raw && Array.isArray(raw.holes) && raw.holes.length === 18) return raw;
    } catch {}
    return freshLiveState();
  }
  function persistLive() { localStorage.setItem(LIVE_KEY, JSON.stringify(live)); }
  let live = loadLive();

  function computeHoleResult(h) {
    const start = activeStartRow(h.par);
    let shotSum = 0, ob = 0, pa = 0, bk = 0, rf = 0, fir = null, gir = false;
    for (let r = start; r < 4; r++) {
      const v = h.rowValues[r];
      shotSum += shotPoint(v);
      if (v === "OB") ob++;
      if (v === "PA") pa++;
      if (v === "BK") bk++;
      if (v === "RF") rf++;
      if (r === start && r !== 3) fir = (v === "FW");
      if (r === 3) gir = (v === "GR");
    }
    const approachEnabled = !gir;
    const approachSum = approachEnabled
      ? (h.approach.pitching || 0) + (h.approach.bunker || 0) + (h.approach.chip || 0)
      : 0;
    const puttVal = h.putt || 0;
    const rawStrokes = shotSum + approachSum + puttVal;
    return { rawStrokes, score: rawStrokes - h.par, fir, gir, ob, pa, bk, rf, puttVal };
  }

  function renderBtnRow(options, selected, disabled, dataset, compact, labelFn) {
    const attrs = Object.entries(dataset).map(([k, v]) => `data-${k}="${v}"`).join(" ");
    const cls = "btn-row" + (disabled ? " disabled" : "") + (compact ? " compact" : "");
    return `<div class="${cls}">${options.map(o => {
      const isSel = String(o) === String(selected);
      const style = isSel ? ` style="background:${pillColor(o)};"` : "";
      const label = labelFn ? labelFn(o) : o;
      return `<button type="button" class="pill-btn${isSel ? " sel" : ""}" data-val="${o}" ${attrs}${style}>${label}</button>`;
    }).join("")}</div>`;
  }

  const shotButtonLabel = (r, v) => (r === 3 && v === "RF") ? "Miss" : v;

  function shotRowHTML(h, r) {
    if (!isRowActive(h.par, r)) return "";
    return `<div class="cat-sub-row">
      <span class="cat-sub-label">${shotRowLabel(h.par, r)}</span>
      ${renderBtnRow(rowOptions(r), h.rowValues[r], false, { kind: "shot", row: r }, false, v => shotButtonLabel(r, v))}
    </div>`;
  }
  function approachRowHTML(h, key, label, enabled) {
    return `<div class="cat-sub-row">
      <span class="cat-sub-label">${label}</span>
      ${renderBtnRow([1, 2, 3, 4], h.approach[key], !enabled, { kind: "approach", sub: key })}
    </div>`;
  }
  function puttRowHTML(h) {
    return `<div class="cat-sub-row">
      <span class="cat-sub-label">퍼팅수</span>
      ${renderBtnRow([0, 1, 2, 3, 4], h.putt, false, { kind: "putt" })}
    </div>`;
  }

  function renderAddPanel() {
    if (live.currentHole >= 18) renderSummaryPage();
    else renderHolePage(live.currentHole);
  }

  function renderHolePage(idx) {
    const h = live.holes[idx];
    const approachEnabled = h.rowValues[3] !== "GR";
    const nine = idx < 9 ? "전반" : "후반";
    const holeNum = idx < 9 ? idx + 1 : idx - 9 + 1;

    const savedHoles = live.holes.filter(x => x.saved);
    const total = sum(savedHoles.map(x => x.result.score));
    const front = sum(live.holes.slice(0, 9).filter(x => x.saved).map(x => x.result.score));
    const back  = sum(live.holes.slice(9, 18).filter(x => x.saved).map(x => x.result.score));

    const shotRows = [0, 1, 2, 3].map(r => shotRowHTML(h, r)).join("");
    const approachRows = [["pitching", "피칭"], ["bunker", "벙커"], ["chip", "칩샷"]]
      .map(([k, l]) => approachRowHTML(h, k, l, approachEnabled)).join("");
    const isLast = idx === 17;

    document.getElementById("panel-add").innerHTML = `
      <div class="live-header">
        <input type="text" id="liveCourse" class="live-course-input" placeholder="골프장명" value="${esc(live.course)}">
        <div class="live-score-wrap">
          <div class="live-score-v">${fmtDiff(total)}</div>
          <div class="live-score-sub">전반${fmtDiff(front)}/후반${fmtDiff(back)}</div>
        </div>
      </div>

      <div class="hole-title-row">
        <div class="hole-title">${nine} Hole ${holeNum}</div>
        <div class="par-picker">
          <span class="lbl">Par</span>
          ${renderBtnRow([3, 4, 5, 6], h.par, false, { kind: "par" }, true)}
        </div>
      </div>

      <div class="cat-group">${shotRows}</div>

      <div class="cat-group ${approachEnabled ? "" : "disabled"}">${approachRows}</div>

      <div class="cat-group">${puttRowHTML(h)}</div>

      <div class="bottom-bar">
        <div class="bottom-row">
          <button class="save-btn" id="holeSaveBtn">저장</button>
          <span class="bottom-score">${h.saved ? fmtDiff(total) : "-"}</span>
          <button class="next-btn" id="holeNextBtn" ${h.saved ? "" : "disabled"}>${isLast ? "라운드 종료" : "다음홀로 이동"}</button>
        </div>
      </div>
    `;
    attachHoleHandlers(idx);
  }

  function attachHoleHandlers(idx) {
    const h = live.holes[idx];
    const panel = document.getElementById("panel-add");

    document.getElementById("liveCourse").addEventListener("input", e => {
      live.course = e.target.value;
      persistLive();
    });

    panel.querySelectorAll(".pill-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const kind = btn.dataset.kind, val = btn.dataset.val;
        if (kind === "par") {
          h.par = +val;
        } else if (kind === "shot") {
          const r = +btn.dataset.row;
          h.rowValues[r] = val;
          if (r === 3 && val === "GR") h.approach = { pitching: null, bunker: null, chip: null };
        } else if (kind === "approach") {
          h.approach[btn.dataset.sub] = +val;
        } else if (kind === "putt") {
          h.putt = +val;
        }
        h.saved = false;
        h.result = null;
        persistLive();
        renderHolePage(idx);
      });
    });

    document.getElementById("holeSaveBtn").addEventListener("click", () => {
      h.result = computeHoleResult(h);
      h.saved = true;
      persistLive();
      renderHolePage(idx);
    });

    document.getElementById("holeNextBtn").addEventListener("click", () => {
      if (!h.saved) return;
      if (idx === 17) {
        finalizeRound();
        live.currentHole = 18;
        persistLive();
        renderAddPanel();
        renderAnalysis(); renderHistory(); renderHeaderHcp();
      } else {
        live.currentHole = idx + 1;
        persistLive();
        renderAddPanel();
      }
      window.scrollTo(0, 0);
    });
  }

  function renderSummaryPage() {
    const total = sum(live.holes.map(h => h.result.rawStrokes));
    const totalPar = sum(live.holes.map(h => h.par));
    document.getElementById("panel-add").innerHTML = `
      <div class="finish-page">
        <div class="finish-title">오늘의 스코어</div>
        <div class="finish-score">${total}<span class="diff">(${fmtDiff(total - totalPar)})</span></div>
        <div class="finish-msg">수고하셨습니다!</div>
        <button class="save-btn" id="appEndBtn" style="max-width:220px;margin:0 auto;">앱 종료</button>
      </div>`;
    document.getElementById("appEndBtn").addEventListener("click", () => {
      localStorage.removeItem(LIVE_KEY);
      live = freshLiveState();
      switchTab("history");
      renderAddPanel();
    });
  }

  function finalizeRound() {
    const holesOut = live.holes.map(h => ({
      par: h.par, score: h.result.score, gir: h.result.gir, fir: h.result.fir,
      ob: h.result.ob, pa: h.result.pa, bk: h.result.bk, rf: h.result.rf,
      approachPitching: h.approach.pitching || 0, approachBunker: h.approach.bunker || 0, approachChip: h.approach.chip || 0,
      putt: h.result.puttVal,
    }));
    const round = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
      date: new Date().toISOString().slice(0, 10),
      course: (live.course || "").trim() || "이름 없는 골프장",
      holes: holesOut,
      fairways: holesOut.filter(h => h.par >= 4 && h.fir).length,
      greens:   holesOut.filter(h => h.gir).length,
      obCount:  sum(holesOut.map(h => h.ob)),
      paCount:  sum(holesOut.map(h => h.pa)),
      bkShotCount: sum(holesOut.map(h => h.bk)),
      roughCount:  sum(holesOut.map(h => h.rf)),
      putts:    sum(holesOut.map(h => h.putt)),
      threePuttCount: holesOut.filter(h => h.putt >= 3).length,
      memo: "",
    };
    rounds.push(round);
    saveRounds(rounds);
  }

  // ── per-round derived metrics ────────────────────────
  // h.score is stored already relative to par (see computeHoleResult()), so the raw stroke total is score + par.
  function roundMetrics(r) {
    const totalPar   = sum(r.holes.map(h => h.par));
    const totalDiff  = sum(r.holes.map(h => h.score));
    const totalScore = totalDiff + totalPar;
    const par45Count = r.holes.filter(h => h.par >= 4).length;
    const buckets = { eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0, triple: 0, quad: 0 };
    r.holes.forEach(h => {
      const d = h.score;
      if (d <= -2) buckets.eagle++;
      else if (d === -1) buckets.birdie++;
      else if (d === 0) buckets.par++;
      else if (d === 1) buckets.bogey++;
      else if (d === 2) buckets.double++;
      else if (d === 3) buckets.triple++;
      else buckets.quad++;
    });
    return { totalScore, totalPar, diff: totalDiff, par45Count, buckets };
  }

  function analyze() {
    if (!rounds.length) return null;
    const byDateDesc = [...rounds].sort((a, b) => new Date(b.date) - new Date(a.date));
    const metrics = byDateDesc.map(roundMetrics);

    const last20 = metrics.slice(0, 20).map(m => m.diff);
    const nBest = Math.min(8, last20.length);
    const handicap = mean([...last20].sort((a, b) => a - b).slice(0, nBest));

    const fwHit = sum(rounds.map(r => r.fairways));
    const fwApplicable = sum(metrics.map(m => m.par45Count));
    const fairwayRate = fwApplicable ? (fwHit / fwApplicable) * 100 : 0;

    const girHit = sum(rounds.map(r => r.greens));
    const girRate = (girHit / (rounds.length * 18)) * 100;

    const avgPutts = mean(rounds.map(r => r.putts));

    const bucketCounts = {};
    BUCKET_META.forEach(b => bucketCounts[b.key] = sum(metrics.map(m => m.buckets[b.key])));
    const totalHoles = rounds.length * 18;

    const trend = [...rounds].sort((a, b) => new Date(a.date) - new Date(b.date))
      .map(r => ({ date: r.date, diff: roundMetrics(r).diff }));

    // ── short-game saves (hole-level, across all rounds) ──
    const allHoles = rounds.flatMap(r => r.holes);
    const bkSaveDen = allHoles.filter(h => h.approachBunker >= 1).length;
    const bkSaveNum = allHoles.filter(h => h.approachBunker >= 1 && h.putt <= 1).length;
    const cpSaveDen = allHoles.filter(h => h.approachChip >= 1).length;
    const cpSaveNum = allHoles.filter(h => h.approachChip >= 1 && h.putt <= 1).length;
    const chipInDen = allHoles.filter(h => h.approachChip >= 1).length;
    const chipInNum = allHoles.filter(h => h.approachChip >= 1 && h.putt === 0).length;
    const parSaveDen = allHoles.filter(h => !h.gir).length;
    const parSaveNum = allHoles.filter(h => !h.gir && h.score <= 0).length;

    // ── extra stats ──
    const roughTotal = sum(rounds.map(r => r.roughCount || 0));
    const bkShotTotal = sum(rounds.map(r => r.bkShotCount || 0));
    const threePuttTotal = sum(rounds.map(r => r.threePuttCount || 0));
    const maxThreePutt = Math.max(0, ...rounds.map(r => r.threePuttCount || 0));
    const par3Strokes = allHoles.filter(h => h.par === 3).map(h => h.score + h.par);
    const par4Strokes = allHoles.filter(h => h.par === 4).map(h => h.score + h.par);
    const par5Strokes = allHoles.filter(h => h.par === 5).map(h => h.score + h.par);
    const avgPar3 = par3Strokes.length ? mean(par3Strokes) : null;
    const avgPar4 = par4Strokes.length ? mean(par4Strokes) : null;
    const avgPar5 = par5Strokes.length ? mean(par5Strokes) : null;

    return {
      handicap, nBest, fairwayRate, girRate, avgPutts, bucketCounts, totalHoles, trend, count: rounds.length,
      bkSaveNum, bkSaveDen, cpSaveNum, cpSaveDen, chipInNum, chipInDen, parSaveNum, parSaveDen,
      roughTotal, bkShotTotal, threePuttTotal, maxThreePutt, avgPar3, avgPar4, avgPar5,
    };
  }

  function renderHeaderHcp() {
    const a = analyze();
    document.getElementById("hdrHcp").textContent = a ? (a.handicap > 0 ? `+${fmt1(a.handicap)}` : fmt1(a.handicap)) : "—";
  }

  // ── analysis panel ───────────────────────────────────
  function renderAnalysis() {
    const el = document.getElementById("panel-analysis");
    const a = analyze();
    if (!a) {
      el.innerHTML = `<div class="card"><div class="empty"><div class="big">⛳️</div>기록된 라운드가 없어요.<br>‘기록 추가’ 탭에서 첫 라운드를 입력해보세요.</div></div>`;
      return;
    }
    const hcpStr = a.handicap > 0 ? `+${fmt1(a.handicap)}` : fmt1(a.handicap);
    el.innerHTML = `
      <div class="stat-grid">
        <div class="stat-tile"><div class="lbl">간이 핸디캡</div><div class="v accent">${hcpStr}</div><div class="sub">최근 ${a.nBest}개 최소 차이 평균</div></div>
        <div class="stat-tile"><div class="lbl">페어웨이 키핑률</div><div class="v">${fmt1(a.fairwayRate)}%</div><div class="sub">파4·5 홀 기준</div></div>
        <div class="stat-tile"><div class="lbl">온그린율</div><div class="v">${fmt1(a.girRate)}%</div><div class="sub">18홀 기준</div></div>
        <div class="stat-tile"><div class="lbl">평균 퍼팅수</div><div class="v">${fmt1(a.avgPutts)}</div><div class="sub">라운드당</div></div>
      </div>

      <div class="card">
        <div class="card-title">숏게임 세이브</div>
        <div class="save-grid">
          <div class="save-row"><span class="lbl">벙커 세이브율</span><span class="v">${fmtRate(a.bkSaveNum, a.bkSaveDen)}</span></div>
          <div class="save-row"><span class="lbl">칩 세이브율</span><span class="v">${fmtRate(a.cpSaveNum, a.cpSaveDen)}</span></div>
          <div class="save-row"><span class="lbl">파 세이브율</span><span class="v">${fmtRate(a.parSaveNum, a.parSaveDen)}</span></div>
          <div class="save-row"><span class="lbl">칩인</span><span class="v">${fmtRate(a.chipInNum, a.chipInDen)}</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">라운드 디테일</div>
        <div class="save-grid">
          <div class="save-row"><span class="lbl">러프</span><span class="v">${fmtPer18(a.roughTotal, a.totalHoles)}</span></div>
          <div class="save-row"><span class="lbl">쓰리퍼트</span><span class="v">${fmtPer18(a.threePuttTotal, a.totalHoles)}</span></div>
          <div class="save-row"><span class="lbl">한 라운드 최다 쓰리퍼트</span><span class="v">${a.maxThreePutt}</span></div>
          <div class="save-row"><span class="lbl">벙커(샷)</span><span class="v">${fmtPer18(a.bkShotTotal, a.totalHoles)}</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">파별 평균 타수</div>
        <div class="save-grid">
          <div class="save-row"><span class="lbl">Par 3</span><span class="v">${a.avgPar3 != null ? fmt1(a.avgPar3) : "—"}</span></div>
          <div class="save-row"><span class="lbl">Par 4</span><span class="v">${a.avgPar4 != null ? fmt1(a.avgPar4) : "—"}</span></div>
          <div class="save-row"><span class="lbl">Par 5</span><span class="v">${a.avgPar5 != null ? fmt1(a.avgPar5) : "—"}</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">스코어 추이 (총타 − 파)</div>
        <div class="chart-wrap" id="trendChart"></div>
      </div>

      <div class="card">
        <div class="card-title">라운드당 평균 스코어 분포</div>
        <div id="distChart"></div>
      </div>

      <div class="hint" style="margin-top:2px;">총 ${a.count}라운드 기록됨</div>
    `;
    renderTrendChart(a.trend);
    renderDistChart(a.bucketCounts, a.totalHoles);
  }

  function renderDistChart(bucketCounts, totalHoles) {
    const el = document.getElementById("distChart");
    const max = Math.max(...BUCKET_META.map(b => bucketCounts[b.key]), 1);
    el.innerHTML = BUCKET_META.map(b => {
      const v = bucketCounts[b.key];
      const pct = Math.max((v / max) * 100, v > 0 ? 3 : 0);
      return `<div class="dist-row">
        <span class="lbl" style="color:${b.color}">${b.label}</span>
        <div class="dist-track"><div class="dist-fill" style="width:${pct}%; background:${b.color}"></div></div>
        <span class="cnt">${fmtPer18(v, totalHoles)}</span>
      </div>`;
    }).join("");
  }

  function renderTrendChart(trend) {
    const wrap = document.getElementById("trendChart");
    if (trend.length < 2) {
      wrap.innerHTML = `<div class="hint" style="padding:10px 0;">추이를 보려면 라운드가 2개 이상 필요해요</div>`;
      return;
    }
    const W = 320, H = 140, PAD = 22;
    const vals = trend.map(t => t.diff);
    const yMin = Math.min(...vals, 0), yMax = Math.max(...vals, 0);
    const yRange = (yMax - yMin) || 1;
    const x = i => PAD + (i / (trend.length - 1)) * (W - PAD * 2);
    const y = v => H - PAD - ((v - yMin) / yRange) * (H - PAD * 2);
    const zeroY = y(0);

    const pts = trend.map((t, i) => [x(i), y(t.diff)]);
    const path = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const areaPath = path + ` L${pts[pts.length-1][0].toFixed(1)},${zeroY} L${pts[0][0].toFixed(1)},${zeroY} Z`;

    const circles = pts.map((p, i) =>
      `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--turf)" data-i="${i}" class="dot" style="cursor:pointer"></circle>`
    ).join("");

    wrap.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet">
        <line x1="${PAD}" y1="${zeroY.toFixed(1)}" x2="${W - PAD}" y2="${zeroY.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="${W - PAD}" y="${zeroY - 4}" text-anchor="end" font-size="9" fill="var(--muted)">파(0)</text>
        <path d="${areaPath}" fill="var(--turf)" opacity="0.10"></path>
        <path d="${path}" fill="none" stroke="var(--turf)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        ${circles}
        <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4.5" fill="var(--flag)"></circle>
      </svg>
      <div class="tooltip" id="trendTip"></div>
    `;
    const svg = wrap.querySelector("svg");
    const tip = document.getElementById("trendTip");
    svg.querySelectorAll(".dot").forEach(dot => {
      const show = () => {
        const i = +dot.dataset.i;
        const t = trend[i];
        const d = t.diff === 0 ? "E" : (t.diff > 0 ? `+${t.diff}` : `${t.diff}`);
        tip.innerHTML = `<div class="t-date">${t.date}</div>${d}`;
        const rect = svg.getBoundingClientRect();
        const wrapRect = wrap.getBoundingClientRect();
        const cx = (dot.cx.baseVal.value / W) * rect.width;
        const cy = (dot.cy.baseVal.value / H) * rect.height;
        tip.style.left = cx + "px";
        tip.style.top = cy + "px";
        tip.classList.add("show");
      };
      dot.addEventListener("mouseenter", show);
      dot.addEventListener("touchstart", e => { show(); }, { passive: true });
      dot.addEventListener("mouseleave", () => tip.classList.remove("show"));
    });
  }

  // ── history panel ─────────────────────────────────────
  function renderHistory() {
    const el = document.getElementById("panel-history");
    if (!rounds.length) {
      el.innerHTML = `<div class="card"><div class="empty"><div class="big">🗒️</div>아직 기록이 없어요.</div></div>`;
      return;
    }
    const sorted = [...rounds].map((r, idx) => ({ r, idx })).sort((a, b) => new Date(b.r.date) - new Date(a.r.date));
    el.innerHTML = sorted.map(({ r, idx }) => {
      const m = roundMetrics(r);
      const chipClass = m.diff < 0 ? "under" : (m.diff === 0 ? "even" : "over");
      const diffStr = m.diff === 0 ? "E" : (m.diff > 0 ? `+${m.diff}` : `${m.diff}`);
      const holeCells = r.holes.map((h, i) => {
        const d = h.score;
        let bg = "transparent", fg = "var(--ink)";
        if (d <= -1) { bg = "var(--turf-wash)"; fg = "var(--turf-deep)"; }
        else if (d >= 2) { bg = "var(--flag-wash)"; fg = "var(--flag)"; }
        return `<div class="r-hole"><div class="hn">${i + 1}</div><div class="hs" style="background:${bg};color:${fg}">${h.score + h.par}</div></div>`;
      });
      return `
      <details class="round-row">
        <summary>
          <div class="r-left">
            <div class="r-date">${r.date}</div>
            <div class="r-course">${esc(r.course)}</div>
          </div>
          <div class="r-right">
            <span class="score-chip ${chipClass}">${m.totalScore} (${diffStr})</span>
            <span class="chevron">▾</span>
          </div>
        </summary>
        <div class="r-detail">
          <div class="r-mini-grid">${holeCells.slice(0, 9).join("")}</div>
          <div class="r-mini-grid">${holeCells.slice(9, 18).join("")}</div>
          <div class="r-extra">
            <span>페어웨이 <b>${r.fairways}</b></span>
            <span>온그린 <b>${r.greens}</b></span>
            <span>퍼팅 <b>${r.putts}</b></span>
            <span>OB <b>${r.obCount ?? 0}</b></span>
            <span>해저드 <b>${r.paCount ?? 0}</b></span>
            <span>러프 <b>${r.roughCount ?? 0}</b></span>
            <span>벙커(샷) <b>${r.bkShotCount ?? 0}</b></span>
            <span>쓰리퍼트 <b>${r.threePuttCount ?? 0}</b></span>
          </div>
          <textarea class="memo-box" data-idx="${idx}" rows="3" placeholder="메모 (예: 그린 스피드, 바람, 컨디션...)">${esc(r.memo || "")}</textarea>
          <button class="del-btn" data-idx="${idx}" style="margin-top:8px;">이 라운드 삭제</button>
        </div>
      </details>`;
    }).join("");

    el.querySelectorAll(".memo-box").forEach(box => {
      box.addEventListener("change", () => {
        rounds[+box.dataset.idx].memo = box.value;
        saveRounds(rounds);
      });
    });

    el.querySelectorAll(".del-btn").forEach(btn => {
      btn.addEventListener("click", e => {
        e.preventDefault();
        const idx = +btn.dataset.idx;
        if (btn.dataset.confirming === "1") {
          rounds.splice(idx, 1);
          saveRounds(rounds);
          renderHistory(); renderAnalysis(); renderHeaderHcp();
          return;
        }
        btn.dataset.confirming = "1";
        btn.classList.add("confirming");
        btn.textContent = "정말 삭제할까요? (다시 탭)";
        setTimeout(() => {
          if (btn.isConnected && btn.dataset.confirming === "1") {
            btn.dataset.confirming = "0";
            btn.classList.remove("confirming");
            btn.textContent = "이 라운드 삭제";
          }
        }, 3000);
      });
    });
  }

  // ── tabs ──────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
    document.querySelectorAll("section.panel").forEach(p => p.classList.toggle("active", p.id === `panel-${name}`));
  }
  document.querySelectorAll("nav.tabs button").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });

  // ── sticky header height sync ─────────────────────────
  function syncHeaderHeight() {
    const header = document.querySelector("header");
    if (header) document.documentElement.style.setProperty("--header-h", header.offsetHeight + "px");
  }
  window.addEventListener("resize", syncHeaderHeight);

  renderAddPanel();
  renderAnalysis();
  renderHistory();
  renderHeaderHcp();
  syncHeaderHeight();
})();
</script>
</body>
</html>
