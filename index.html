  // ── analysis panel: two-period side-by-side comparison ─
  function renderAnalysis() {
    const el = document.getElementById("panel-analysis");
    if (!rounds.length) {
      el.innerHTML = `<div class="card"><div class="empty"><div class="big">⛳️</div>기록된 라운드가 없어요.<br>‘기록 추가’ 탭에서 첫 라운드를 입력해보세요.</div></div>`;

      if (m.trigger) {

  function renderRadarChart(metrics, elId) {
    const el = document.getElementById(elId || "radarChart");
    const N = metrics.length;
    const W = 340, H = 340, cx = W / 2, cy = H / 2, R = 88;
    const angleFor = i => (-90 + i * (360 / N)) * Math.PI / 180;
    const ringLevels = [0.25, 0.5, 0.75, 1];

    const rings = ringLevels.map(lv => {
      const pts = metrics.map((_, i) => {
        const a = angleFor(i);
        return `${cx + lv * R * Math.cos(a)},${cy + lv * R * Math.sin(a)}`;
      });
      return `<polygon points="${pts.join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
    }).join("");

    const axisLines = metrics.map((_, i) => {
      const a = angleFor(i);
      return `<line x1="${cx}" y1="${cy}" x2="${cx + R * Math.cos(a)}" y2="${cy + R * Math.sin(a)}" stroke="var(--line)" stroke-width="1"/>`;
    }).join("");

    const dataPts = metrics.map((m, i) => {
      const a = angleFor(i);
      const r = Math.max(0, Math.min(100, m.value)) / 100 * R;
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    });
    const dataPoly = dataPts.map(p => p.join(",")).join(" ");
    const dots = dataPts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--turf)"/>`).join("");

    const labels = metrics.map((m, i) => {
      const a = angleFor(i);
      const lx = cx + (R + 30) * Math.cos(a), ly = cy + (R + 30) * Math.sin(a);
      const anchor = Math.abs(Math.cos(a)) < 0.3 ? "middle" : (Math.cos(a) > 0 ? "start" : "end");
      return `<text x="${lx}" y="${ly - 3}" text-anchor="${anchor}" font-size="12" font-weight="700" fill="var(--ink-2)">${m.label}</text>
              <text x="${lx}" y="${ly + 11}" text-anchor="${anchor}" font-size="12" fill="var(--muted)">${fmt1(m.value)}%</text>`;
    }).join("");

    el.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" preserveAspectRatio="xMidYMid meet">
        ${rings}
        ${axisLines}
        <polygon points="${dataPoly}" fill="var(--turf)" opacity="0.18" stroke="var(--turf)" stroke-width="2" stroke-linejoin="round"/>
        ${dots}
        ${labels}
      </svg>`;
  }

  function renderDistChart(bucketCounts, totalHoles, elId) {
    const el = document.getElementById(elId || "distChart");
    const max = Math.max(...BUCKET_META.map(b => bucketCounts[b.key]), 1);
    el.innerHTML = BUCKET_META.map(b => {
      const v = bucketCounts[b.key];
      const pct = Math.max((v / max) * 100, v > 0 ? 3 : 0);
      return `<div class="dist-row">
        <span class="lbl" style="color:${b.color}">${b.label}</span>
        <div class="dist-track"><div class="dist-fill" style="width:${pct}%; background:${b.color}"></div></div>
        <span class="cnt">${v}/${totalHoles}</span>
      </div>`;
    }).join("");
  }

  function renderTrendChart(trend, elId) {
    const wrap = document.getElementById(elId || "trendChart");
    const tipId = (elId || "trendChart") + "Tip";
    if (trend.length < 2) {
      wrap.innerHTML = `<div class="hint" style="padding:10px 0;">라운드 2개 이상 필요</div>`;
      return;
    }
    const W = 240, H = 100, PAD = 16;
    const vals = trend.map(t => t.diff);
    const yMin = Math.min(...vals, 0), yMax = Math.max(...vals, 0);
    const yRange = (yMax - yMin) || 1;
    const x = i => PAD + (i / (trend.length - 1)) * (W - PAD * 2);
    const y = v => H - PAD - ((v - yMin) / yRange) * (H - PAD * 2);
    const zeroY = y(0);

    const pts = trend.map((t, i) => [x(i), y(t.diff)]);
    const path = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const areaPath = path + ` L${pts[pts.length-1][0].toFixed(1)},${zeroY} L${pts[0][0].toFixed(1)},${zeroY} Z`;

    const circles = pts.map((p, i) =>
      `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--turf)" data-i="${i}" class="dot" style="cursor:pointer"></circle>`
    ).join("");

    wrap.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" preserveAspectRatio="xMidYMid meet">
        <line x1="${PAD}" y1="${zeroY.toFixed(1)}" x2="${W - PAD}" y2="${zeroY.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="${W - PAD}" y="${zeroY - 4}" text-anchor="end" font-size="10" fill="var(--muted)">파(0)</text>
        <path d="${areaPath}" fill="var(--turf)" opacity="0.10"></path>
        <path d="${path}" fill="none" stroke="var(--turf)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        ${circles}
        <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4.5" fill="var(--flag)"></circle>
      </svg>
      <div class="tooltip" id="${tipId}"></div>
    `;
    const svg = wrap.querySelector("svg");
    const tip = document.getElementById(tipId);
    svg.querySelectorAll(".dot").forEach(dot => {
      const show = () => {
        const i = +dot.dataset.i;
        const t = trend[i];
        const d = t.diff === 0 ? "E" : (t.diff > 0 ? `+${t.diff}` : `${t.diff}`);
        tip.innerHTML = `<div class="t-date">${t.date}</div>${d}`;
        const rect = svg.getBoundingClientRect();
        const wrapRect = wrap.getBoundingClientRect();
        const cx = (dot.cx.baseVal.value / W) * rect.width;
        const cy = (dot.cy.baseVal.value / H) * rect.height;
        tip.style.left = cx + "px";
        tip.style.top = cy + "px";
        tip.classList.add("show");
      };
      dot.addEventListener("mouseenter", show);
      dot.addEventListener("touchstart", e => { show(); }, { passive: true });
      dot.addEventListener("mouseleave", () => tip.classList.remove("show"));
    });
  }

  // ── hole detail overlay (read-only text recap of one hole's entry) ──
  function renderHoleRecapLine(h, i) {
    const nine = i < 9 ? "전반" : "후반";
    const holeNum = i < 9 ? i + 1 : i - 9 + 1;
    const start = activeStartRow(h.par);
    const rv = h.rowValues || [];
    let grRow = -1;
    for (let rr = start; rr <= 3; rr++) {
      const v = rv[rr] != null ? rv[rr] : (rr === 3 ? "GR" : "FW");
      if (v === "GR") { grRow = rr; break; }
    }
    const lastRow = grRow !== -1 ? grRow : 3;
    const shotParts = [];
    for (let r = start; r <= lastRow; r++) {
      shotParts.push(rv[r] != null ? rv[r] : (r === 3 ? "GR" : "FW"));
    }
    const approachParts = [["피칭", h.approachPitching], ["벙커", h.approachBunker], ["칩샷", h.approachChip], ["벌타", h.approachPenalty]]
      .filter(([, v]) => v)
      .map(([l, v]) => `${l}(X${v})`);
    const puttPart = `퍼팅(X${h.putt})`;
    const parts = [...shotParts, ...approachParts, puttPart];
    return `<div class="hd-line">
      <span class="hd-line-hole">${nine} ${holeNum}<span class="hd-line-par">(Par ${h.par})</span> :</span>
      <span class="hd-line-chain">${parts.join(" → ")}</span>
    </div>`;
  }

            <span>쓰리퍼트 <b>${r.threePuttCount ?? 0}</b></span>
          </div>

          <div class="r-actions">

      </div>`;

    overlay.querySelector("#scorecardCloseBtn").addEventListener("click", () => overlay.remove());

    overlay.querySelectorAll(".r-hole").forEach(cell => {
      cell.addEventListener("click", () => openHoleDetail(idx));
    });

    const memoBox = overlay.querySelector(".memo-box");
    memoBox.addEventListener("change", () => {
      rounds[idx].memo = memoBox.value;
      saveRounds(rounds);
    });

    const delBtn = overlay.querySelector(".del-btn");
    delBtn.addEventListener("click", () => {
      if (delBtn.dataset.confirming === "1") {
        rounds.splice(idx, 1);
        saveRounds(rounds);
        overlay.remove();

      }
      delBtn.dataset.confirming = "1";

      setTimeout(() => {

          delBtn.classList.remove("confirming");

  }

  // ── backup: export all rounds to a JSON file, import them back ──
  const LAST_BACKUP_KEY = "golf-tracker-last-backup-date";
  function exportRounds(force) {
    const today = todayISO();
    const filename = `golf-tracker-backup-${today}.csv`;
    const statusEl = document.getElementById("backupStatus");
    // Browsers never overwrite an existing download — re-downloading the same filename just
    // creates "golf-tracker-backup-2026-08-07 (1).csv", "(2).csv", etc. Since there's no way to
    // force an overwrite from JS, the only way to stop duplicates is to skip re-downloading once
    // today's backup already exists — unless the user explicitly confirms via the popup below.
    if (!force && localStorage.getItem(LAST_BACKUP_KEY) === today) {
      openConfirmPopup(
        `오늘 백업은 이미 만들어졌어요: ${filename}<br>그래도 다시 만들까요?`,
        () => exportRounds(true),
        () => {},
        { yesLabel: "그래도 다시 만들기", noLabel: "취소" }
      );
      return;
    }
    const payload = { app: "golf-tracker", version: 1, exportedAt: new Date().toISOString(), rounds };
    // Plain browser download straight to the device's Downloads folder — no OS share sheet.
    // .csv/text-csv content is still plain JSON text; import parses it the same way regardless
    // of extension.
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    localStorage.setItem(LAST_BACKUP_KEY, today);
    if (statusEl) statusEl.textContent = force ? `다시 백업했어요: ${filename}` : `백업했어요: ${filename}`;
  }
  function importRoundsFromFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let incoming;
      try {
        const data = JSON.parse(reader.result);
        incoming = Array.isArray(data) ? data : (Array.isArray(data.rounds) ? data.rounds : null);
      } catch { incoming = null; }
      if (!incoming) {
        const statusEl = document.getElementById("backupStatus");
        if (statusEl) statusEl.textContent = "올바른 백업 파일이 아니에요.";
        return;
      }
      const existingIds = new Set(rounds.map(r => r.id));
      const toAdd = incoming.filter(r => r && r.id && !existingIds.has(r.id));
      rounds = rounds.concat(toAdd);
      saveRounds(rounds);
      const dupCount = incoming.length - toAdd.length;
      renderAnalysis(); renderRoundLog(); renderHeaderHcp();
      const statusEl = document.getElementById("backupStatus");
      if (statusEl) statusEl.textContent = `${toAdd.length}개 라운드를 가져왔어요.${dupCount > 0 ? ` (중복 ${dupCount}개 제외)` : ""}`;
    };
    reader.readAsText(file);
  }

          return `<div class="log-row">

        saveRounds(rounds);

      inp.addEventListener("change", () => {
        rounds[+inp.dataset.idx].memo = inp.value;

    });
    el.querySelectorAll(".log-scorecard-btn").forEach(btn => {
      btn.addEventListener("click", () => openScorecardPopup(+btn.dataset.idx));

        <p class="backup-note backup-note-tight"><span class="backup-note-label">PC에서 가져오기</span> : PC에서 파일을 위 경로로 보낸 후 [백업 데이터 가져오기]로 들어가 파일을 선택하고 완료를 누르세요.</p>
        <p class="backup-note backup-note-gap"><span class="backup-note-label">PC 에서 앱 열기</span></p>
        <p class="backup-note">https://kcjddj.github.io/golf-tracker/ 주소로 접속하면 설치 필요없이 바로 사용할 수 있습니다.</p>
        <p class="backup-note">다만 데이터(localStorage)는 기기/브라우저별로 완전히 분리되어 있어서 서로 자동 동기화되지 않으니, 최신 상태를 유지하려면 그때그때 백업파일을 주고받아야 합니다.</p>
      </div>`;
    document.getElementById("exportBtn").addEventListener("click", () => exportRounds());
    document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("importFile").addEventListener("change", e => {
      const file = e.target.files[0];
      if (file) importRoundsFromFile(file);
      e.target.value = "";
    });
  }

  // ── tabs ──────────────────────────────────────────────
  // liveBottomBar lives outside the animated .panel (see comment at its declaration) so its
  // fixed position never gets scoped to an ancestor mid-transition; visibility is driven here.
  function updateBottomBarVisibility() {
    const onAddTab = document.getElementById("panel-add").classList.contains("active");
    document.getElementById("liveBottomBar").classList.toggle("show", onAddTab && !!replayState);
  }
  function switchTab(name) {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
    document.querySelectorAll("section.panel").forEach(p => p.classList.toggle("active", p.id === `panel-${name}`));
    updateBottomBarVisibility();
  }
  document.querySelectorAll("nav.tabs button").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });

  // ── sticky header height sync ─────────────────────────
  function syncHeaderHeight() {
    const header = document.querySelector("header");
    if (header) document.documentElement.style.setProperty("--header-h", header.offsetHeight + "px");
  }
  window.addEventListener("resize", syncHeaderHeight);
  // Portrait/landscape scorecard each keep their own copy of the date/course text fields (so
  // typing never fights a cross-orientation re-render mid-keystroke); re-render on an actual
  // rotation so whichever copy becomes visible reflects what was just typed into the other one.
  window.addEventListener("orientationchange", renderAddPanel);

  renderAddPanel();
  renderAnalysis();
  renderRoundLog();
  renderBackup();
  renderHeaderHcp();
  syncHeaderHeight();
})();
</script>
</body>
</html>
