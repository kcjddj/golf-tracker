      return;
    }
    const sorted = [...rounds].map((r, idx) => ({ r, idx })).sort((a, b) => new Date(b.r.date) - new Date(a.r.date));
    el.innerHTML = sorted.map(({ r, idx }) => {
      const m = roundMetrics(r);
      const chipClass = m.diff < 0 ? "under" : (m.diff === 0 ? "even" : "over");
      const diffStr = m.diff === 0 ? "E" : (m.diff > 0 ? `+${m.diff}` : `${m.diff}`);
      const holeCells = r.holes.map((h, i) => {
        const d = h.score;
        let bg = "transparent", fg = "var(--ink)";
        if (d <= -1) { bg = "var(--turf-wash)"; fg = "var(--turf-deep)"; }
        else if (d >= 2) { bg = "var(--flag-wash)"; fg = "var(--flag)"; }
        const holeNum = i < 9 ? i + 1 : i - 9 + 1;
        return `<div class="r-hole" data-hole="${i}"><div class="hn">${holeNum}<span class="hp">(${h.par})</span></div><div class="hs" style="background:${bg};color:${fg}">${fmtScoreZ(h.score + h.par, h.score)}</div></div>`;
      });
      return `
      <details class="round-row" data-ridx="${idx}">
        <summary>
          <div class="r-left">
            <div class="r-date">${r.date}</div>
            <div class="r-course-line">
              <input type="text" class="r-course-input" data-idx="${idx}" placeholder="골프장명" value="${esc(r.course)}">
              ${nineCourseTagsHTML(r)}
            </div>
          </div>
          <div class="r-right">
            <span class="score-chip ${chipClass}">${scoreNotation === "total" ? `${m.totalScore}` : diffStr}</span>
            <span class="chevron">▾</span>
          </div>
        </summary>
        <div class="r-detail">
          <div class="r-mini-grid">${holeCells.slice(0, 9).join("")}</div>
          <div class="r-mini-grid">${holeCells.slice(9, 18).join("")}</div>
          <div class="r-extra">
            <span>페어웨이 <b>${r.fairways}</b></span>
            <span>온그린 <b>${r.greens}</b></span>
            <span>퍼팅 <b>${r.putts}</b></span>
            <span>OB <b>${r.obCount ?? 0}</b></span>
            <span>해저드 <b>${r.paCount ?? 0}</b></span>
            <span>러프 <b>${r.roughCount ?? 0}</b></span>
            <span>벙커(샷) <b>${r.bkShotCount ?? 0}</b></span>
            <span>쓰리퍼트 <b>${r.threePuttCount ?? 0}</b></span>
          </div>
          <textarea class="memo-box" data-idx="${idx}" rows="3" placeholder="메모 (예: 그린 스피드, 바람, 컨디션...)">${esc(r.memo || "")}</textarea>
          <div class="r-actions">
            <button class="del-btn" data-idx="${idx}">이 라운드 삭제</button>
            <span class="tap-hint">복기 하려면 스코어카드를 터치 하세요</span>
          </div>
        </div>
      </details>`;
    }).join("");

    el.querySelectorAll(".r-hole").forEach(cell => {
      cell.addEventListener("click", () => {
        const ridx = +cell.closest(".round-row").dataset.ridx;
        openHoleDetail(ridx);
      });
    });

    el.querySelectorAll(".r-course-input").forEach(inp => {
      inp.addEventListener("click", e => e.stopPropagation());
      inp.addEventListener("change", () => {
        const idx = +inp.dataset.idx;
        const val = inp.value.trim() || "이름 없는 골프장";
        rounds[idx].course = val;
        inp.value = val;
        saveRounds(rounds);
        renderRoundLog();
      });
    });

    el.querySelectorAll(".memo-box").forEach(box => {
      box.addEventListener("change", () => {
        rounds[+box.dataset.idx].memo = box.value;
        saveRounds(rounds);
      });
    });

    el.querySelectorAll(".del-btn").forEach(btn => {
      btn.addEventListener("click", e => {
        e.preventDefault();
        const idx = +btn.dataset.idx;
        if (btn.dataset.confirming === "1") {
          rounds.splice(idx, 1);
          saveRounds(rounds);
          renderHistory(); renderRoundLog(); renderAnalysis(); renderHeaderHcp();
          return;
        }
        btn.dataset.confirming = "1";
        btn.classList.add("confirming");
        btn.textContent = "정말 삭제할까요? (다시 탭)";
        setTimeout(() => {
          if (btn.isConnected && btn.dataset.confirming === "1") {
            btn.dataset.confirming = "0";
            btn.classList.remove("confirming");
            btn.textContent = "이 라운드 삭제";
          }
        }, 3000);
      });
    });
  }

  // ── backup: export all rounds to a JSON file, import them back ──
  const LAST_BACKUP_KEY = "golf-tracker-last-backup-date";
  function exportRounds(force) {
    const today = todayISO();
    const filename = `golf-tracker-backup-${today}.csv`;
    const statusEl = document.getElementById("backupStatus");
    // Browsers never overwrite an existing download — re-downloading the same filename just
    // creates "golf-tracker-backup-2026-08-07 (1).csv", "(2).csv", etc. Since there's no way to
    // force an overwrite from JS, the only way to stop duplicates is to skip re-downloading once
    // today's backup already exists — unless the user explicitly asks via "그래도 다시 만들기".
    const forceBtn = document.getElementById("forceBackupBtn");
    if (!force && localStorage.getItem(LAST_BACKUP_KEY) === today) {
      if (statusEl) statusEl.textContent = `오늘 백업은 이미 만들어졌어요: ${filename}`;
      if (forceBtn) forceBtn.style.display = "block";
      return;
    }
    const payload = { app: "golf-tracker", version: 1, exportedAt: new Date().toISOString(), rounds };
    // Plain browser download straight to the device's Downloads folder — no OS share sheet.
    // .csv/text-csv content is still plain JSON text; import parses it the same way regardless
    // of extension.
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    localStorage.setItem(LAST_BACKUP_KEY, today);
    if (statusEl) statusEl.textContent = force ? `다시 백업했어요: ${filename}` : `백업했어요: ${filename}`;
    if (forceBtn) forceBtn.style.display = "none";
  }
  function importRoundsFromFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let incoming;
      try {
        const data = JSON.parse(reader.result);
        incoming = Array.isArray(data) ? data : (Array.isArray(data.rounds) ? data.rounds : null);
      } catch { incoming = null; }
      if (!incoming) {
        const statusEl = document.getElementById("backupStatus");
        if (statusEl) statusEl.textContent = "올바른 백업 파일이 아니에요.";
        return;
      }
      const existingIds = new Set(rounds.map(r => r.id));
      const toAdd = incoming.filter(r => r && r.id && !existingIds.has(r.id));
      rounds = rounds.concat(toAdd);
      saveRounds(rounds);
      const dupCount = incoming.length - toAdd.length;
      renderAnalysis(); renderHistory(); renderRoundLog(); renderHeaderHcp();
      const statusEl = document.getElementById("backupStatus");
      if (statusEl) statusEl.textContent = `${toAdd.length}개 라운드를 가져왔어요.${dupCount > 0 ? ` (중복 ${dupCount}개 제외)` : ""}`;
    };
    reader.readAsText(file);
  }

  // ── 라운드기록 panel (one line per round: date/course/score/memo) ──
  function renderRoundLog() {
    const el = document.getElementById("panel-roundlog");
    if (!rounds.length) {
      el.innerHTML = `<div class="card"><div class="empty"><div class="big">📋</div>아직 라운드 기록이 없어요.</div></div>`;
    } else {
      const sorted = [...rounds].map((r, idx) => ({ r, idx })).sort((a, b) => new Date(b.r.date) - new Date(a.r.date));
      el.innerHTML = `<div class="card"><div class="card-title">라운드 기록</div>${
        sorted.map(({ r, idx }) => {
          const m = roundMetrics(r);
          const diffStr = m.diff === 0 ? "E" : (m.diff > 0 ? `+${m.diff}` : `${m.diff}`);
          const compactParts = [];
          if (r.courseFront) compactParts.push(esc(r.courseFront));
          if (r.courseBack) compactParts.push(esc(r.courseBack));
          const compactTag = compactParts.length ? `<span class="log-nine-tag">(${compactParts.join("/")})</span>` : "";
          return `<div class="log-row">
            <div class="log-top">
              <span class="log-date">${r.date}</span>
              <input type="text" class="log-course-input" data-idx="${idx}" placeholder="골프장명" value="${esc(r.course)}">
              ${compactTag}
              <span class="log-score">${scoreNotation === "total" ? `${m.totalScore}` : diffStr}</span>
            </div>
            <input type="text" class="log-memo-input" data-idx="${idx}" placeholder="메모" value="${esc(r.memo || "")}">
          </div>`;
        }).join("")
      }</div>`;
    }
    if (!rounds.length) return;
    el.querySelectorAll(".log-course-input").forEach(inp => {
      inp.addEventListener("change", () => {
        const idx = +inp.dataset.idx;
        const val = inp.value.trim() || "이름 없는 골프장";
        rounds[idx].course = val;
        inp.value = val;
        saveRounds(rounds);
        renderHistory();
      });
    });
    el.querySelectorAll(".log-memo-input").forEach(inp => {
      inp.addEventListener("change", () => {
        rounds[+inp.dataset.idx].memo = inp.value;
        saveRounds(rounds);
        renderHistory();
      });
    });
  }

  // ── 백업 panel (export/import buttons) ─────────────────
  function renderBackup() {
    const el = document.getElementById("panel-backup");
    el.innerHTML = `
      <div class="card">
        <div class="card-title">백업</div>
        <p class="backup-note">백업파일(golf-tracker-backup-날짜.csv)은 폰 → 내 파일 → 내장저장공간 → Download 에 있습니다.</p>
        <div class="backup-bar">
          <button type="button" class="backup-btn" id="exportBtn">백업하기</button>
          <button type="button" class="backup-btn" id="importBtn">백업 데이터 가져오기</button>
          <input type="file" id="importFile" accept="text/csv" style="display:none">
        </div>
        <span class="backup-status" id="backupStatus"></span>
        <button type="button" class="backup-link" id="forceBackupBtn" style="display:none;">그래도 다시 만들기</button>
        <p class="backup-note">내 파일 → 내장저장공간 → Download 에서 파일을 찾아 터치하면 파일을 가져옵니다.</p>
        <p class="backup-note"><b>PC로 보내기</b> : 위 경로 내의 파일을 찾아 PC로 보내세요.</p>
        <p class="backup-note"><b>PC에서 가져오기</b> : PC에서 파일을 위 경로로 보낸 후 [백업 데이터 가져오기]로 들어가 파일을 찾아 터치하세요.</p>
      </div>`;
    document.getElementById("exportBtn").addEventListener("click", () => exportRounds());
    document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("forceBackupBtn").addEventListener("click", () => exportRounds(true));
    document.getElementById("importFile").addEventListener("change", e => {
      const file = e.target.files[0];
      if (file) importRoundsFromFile(file);
      e.target.value = "";
    });
  }

  // ── tabs ──────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
    document.querySelectorAll("section.panel").forEach(p => p.classList.toggle("active", p.id === `panel-${name}`));
    document.getElementById("hdrDate").classList.toggle("show", name === "add");
  }
  document.querySelectorAll("nav.tabs button").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });

  // ── header round-date field (기록 추가 탭에서만 노출) ──
  function renderHeaderDate() {
    document.getElementById("hdrDate").value = live.date || todayISO();
  }
  document.getElementById("hdrDate").addEventListener("change", e => {
    live.date = e.target.value || todayISO();
    persistLive();
  });

  // ── sticky header height sync ─────────────────────────
  function syncHeaderHeight() {
    const header = document.querySelector("header");
    if (header) document.documentElement.style.setProperty("--header-h", header.offsetHeight + "px");
  }
  window.addEventListener("resize", syncHeaderHeight);

  renderAddPanel();
  renderAnalysis();
  renderHistory();
  renderRoundLog();
  renderBackup();
  renderHeaderHcp();
  renderHeaderDate();
  syncHeaderHeight();
})();
</script>
</body>
</html>
